<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кинотека</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #ececf1; font: 28px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  img { width: 160px; height: 160px; border-radius: 36px; }
  #msg { color: #9a9cab; }
</style>
</head>
<body>
<img src="icon.png" alt="">
<div id="msg">Открываю Кинотеку…</div>
<script>
  // Оболочка приложения «Кинотека» для Samsung Tizen: сама полка живёт на сервере, приложение просто открывает её.
  // Внутри приложения пульт работает как пульт: стрелки, ОК и «Назад» приходят странице нажатиями клавиш.
  var URL = 'https://claude-vm.tail65a20f.ts.net:10000/?app=tv';  // метка: полка знает, что открыта в приложении, а не в браузере
  try {
    ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'ChannelUp', 'ChannelDown'].forEach(function (k) {
      try { tizen.tvinputdevice.registerKey(k); } catch (e) { /* нет такой кнопки на пульте */ }
    });
  } catch (e) { /* не телевизор */ }
  function go() { location.replace(URL); }
  if (navigator.onLine === false) {
    document.getElementById('msg').textContent = 'Нет интернета — открою, как только появится';
    window.addEventListener('online', go);
  } else {
    go();
  }
</script>
</body>
</html>
